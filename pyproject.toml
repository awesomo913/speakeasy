[project]
name = "speakeasy"
version = "1.0.0"
description = "Windows voice-dictation app: mouse/hotkey toggle, local whisper transcription, paste at cursor."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv-build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
