<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeakEasy — Talk. It types. Anywhere on Windows.">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#4d96ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d96ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4d96ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="#14141f"/>
  <ellipse cx="980" cy="200" rx="360" ry="220" fill="url(#glow)"/>

  <!-- faint wave texture -->
  <path d="M 0 70 C 220 30, 420 110, 640 70 C 860 30, 1060 110, 1280 70" stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.15"/>
  <path d="M 0 340 C 220 380, 420 300, 640 340 C 860 380, 1060 300, 1280 340" stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.15"/>

  <!-- app tile -->
  <g transform="translate(90,104)">
    <rect width="104" height="104" rx="26" fill="url(#accent)"/>
    <rect x="38" y="20" width="28" height="46" rx="14" fill="#ffffff"/>
    <path d="M 26 50 A 26 26 0 0 0 78 50" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <line x1="52" y1="76" x2="52" y2="86" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- title + tagline -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="90" y="290" font-size="72" font-weight="700" fill="#f5f7fa">SpeakEasy</text>
    <text x="92" y="330" font-size="25" fill="#a9b4c4">Talk. It types. Anywhere on Windows.</text>
  </g>

  <!-- chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#14141f" text-anchor="middle">
    <rect x="220" y="128" width="124" height="32" rx="16" fill="url(#accent)"/>
    <text x="282" y="149">100% local</text>
    <rect x="354" y="128" width="112" height="32" rx="16" fill="url(#accent)"/>
    <text x="410" y="149">Free · MIT</text>
    <rect x="476" y="128" width="96" height="32" rx="16" fill="url(#accent)"/>
    <text x="524" y="149">Any app</text>
    <text x="220" y="190" font-size="15" font-weight="400" fill="#8a8aa3" text-anchor="start">Whisper on your CPU · no account · no cloud</text>
  </g>

  <!-- mock app window with dictated text -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="720" y="70" width="480" height="210" rx="16" fill="#1e1e2e" stroke="#2c2c42" stroke-width="1.5"/>
    <circle cx="746" cy="96" r="6" fill="#ef476f" opacity="0.8"/>
    <circle cx="766" cy="96" r="6" fill="#ffd166" opacity="0.8"/>
    <circle cx="786" cy="96" r="6" fill="#2ec4b6" opacity="0.8"/>
    <text x="960" y="101" font-size="14" fill="#8a8aa3" text-anchor="middle">notes.md</text>
    <line x1="720" y1="118" x2="1200" y2="118" stroke="#2c2c42" stroke-width="1.5"/>
    <text x="748" y="160" font-size="21" fill="#e6e6f0">Quick update: the build is green and</text>
    <text x="748" y="194" font-size="21" fill="#e6e6f0">I'm moving on to the release notes.</text>
    <text x="748" y="228" font-size="21" fill="#e6e6f0">Rename <tspan font-family="Consolas, monospace" fill="#2ec4b6">parseConfig()</tspan> next</text>
    <rect x="1036" y="211" width="3" height="24" rx="1.5" fill="#2ec4b6"/>
  </g>

  <!-- listening pill -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="660" y="252" width="250" height="56" rx="28" fill="#1e1e2e" stroke="#ef476f" stroke-width="2"/>
    <circle cx="690" cy="280" r="8" fill="#ef476f"/>
    <text x="708" y="286" font-size="18" font-weight="600" fill="#e6e6f0">Listening</text>
    <g stroke="#ef476f" stroke-width="4" stroke-linecap="round">
      <line x1="806" y1="272" x2="806" y2="288"/>
      <line x1="818" y1="264" x2="818" y2="296"/>
      <line x1="830" y1="268" x2="830" y2="292"/>
      <line x1="842" y1="260" x2="842" y2="300"/>
      <line x1="854" y1="270" x2="854" y2="290"/>
      <line x1="866" y1="266" x2="866" y2="294"/>
      <line x1="878" y1="274" x2="878" y2="286"/>
    </g>
  </g>
</svg>
