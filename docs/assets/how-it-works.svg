<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How SpeakEasy works: Trigger, Record, Whisper on your PC, optional AI polish, Paste at cursor">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#4d96ff"/>
    </linearGradient>
    <g id="arrow">
      <line x1="0" y1="0" x2="84" y2="0" stroke="#3a7fd6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 76 -8 L 88 0 L 76 8" stroke="#4d96ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="280" fill="#14141f"/>

  <text x="600" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8aa3" letter-spacing="1.5" text-anchor="middle">EVERYTHING RUNS ON YOUR PC — EXCEPT STEP 4, AND ONLY IF YOU TURN IT ON</text>

  <!-- arrows between steps -->
  <use href="#arrow" x="170" y="130"/>
  <use href="#arrow" x="410" y="130"/>
  <use href="#arrow" x="650" y="130"/>
  <use href="#arrow" x="890" y="130"/>

  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <!-- 1 Trigger -->
    <g transform="translate(120,130)">
      <circle r="44" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <rect x="-12" y="-20" width="24" height="36" rx="12" fill="none" stroke="#f5f7fa" stroke-width="3.5"/>
      <line x1="0" y1="-20" x2="0" y2="-6" stroke="#f5f7fa" stroke-width="3.5"/>
      <text y="78" font-size="18" font-weight="600" fill="#f5f7fa">1 · Trigger</text>
      <text y="100" font-size="13" fill="#a9b4c4">Side button or Ctrl+Alt+D</text>
    </g>
    <!-- 2 Record -->
    <g transform="translate(360,130)">
      <circle r="44" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <g stroke="#ef476f" stroke-width="4" stroke-linecap="round">
        <line x1="-16" y1="-6" x2="-16" y2="6"/>
        <line x1="-8" y1="-14" x2="-8" y2="14"/>
        <line x1="0" y1="-20" x2="0" y2="20"/>
        <line x1="8" y1="-12" x2="8" y2="12"/>
        <line x1="16" y1="-5" x2="16" y2="5"/>
      </g>
      <text y="78" font-size="18" font-weight="600" fill="#f5f7fa">2 · Record</text>
      <text y="100" font-size="13" fill="#a9b4c4">Up to 10 min · stops on silence</text>
    </g>
    <!-- 3 Whisper -->
    <g transform="translate(600,130)">
      <circle r="44" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <rect x="-18" y="-18" width="36" height="36" rx="7" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <g stroke="#f5f7fa" stroke-width="3" stroke-linecap="round">
        <line x1="-9" y1="-18" x2="-9" y2="-25"/><line x1="0" y1="-18" x2="0" y2="-25"/><line x1="9" y1="-18" x2="9" y2="-25"/>
        <line x1="-9" y1="18" x2="-9" y2="25"/><line x1="0" y1="18" x2="0" y2="25"/><line x1="9" y1="18" x2="9" y2="25"/>
      </g>
      <text y="6" font-size="13" font-weight="700" fill="#2ec4b6">AI</text>
      <text y="78" font-size="18" font-weight="600" fill="#f5f7fa">3 · Whisper</text>
      <text y="100" font-size="13" fill="#a9b4c4">Speech → text, offline</text>
    </g>
    <!-- 4 AI polish (optional) -->
    <g transform="translate(840,130)">
      <circle r="44" fill="#1e1e2e" stroke="#4d96ff" stroke-width="3" stroke-dasharray="6 5"/>
      <path d="M0 -20 L5.5 -5.5 L20 0 L5.5 5.5 L0 20 L-5.5 5.5 L-20 0 L-5.5 -5.5 Z" fill="#f5f7fa"/>
      <text y="78" font-size="18" font-weight="600" fill="#f5f7fa">4 · AI polish</text>
      <text y="100" font-size="13" fill="#a9b4c4">Optional · text only · off by default</text>
    </g>
    <!-- 5 Paste -->
    <g transform="translate(1080,130)">
      <circle r="44" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <line x1="-14" y1="-8" x2="10" y2="-8" stroke="#f5f7fa" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-14" y1="4" x2="4" y2="4" stroke="#f5f7fa" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="10" y="-4" width="3.5" height="18" rx="1.5" fill="#2ec4b6"/>
      <text y="78" font-size="18" font-weight="600" fill="#f5f7fa">5 · Paste</text>
      <text y="100" font-size="13" fill="#a9b4c4">Right at your cursor</text>
    </g>
  </g>
</svg>
